<!DOCTYPE html>
<html>
<head>
    <title>Kanha Sweets Admin</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:#fff5e1;
        }

        .navbar{
            background:#8B0000;
            color:white;
            padding:20px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .navbar h1{
            margin:0;
            color:#FFD700;
        }

        .container{
            padding:30px;
        }

        .card{
            background:white;
            border-radius:15px;
            padding:20px;
            margin-bottom:20px;
            box-shadow:0px 4px 10px rgba(0,0,0,0.1);
        }

        .card h2{
            color:#8B0000;
        }

        .btn{
            background:#8B0000;
            color:white;
            padding:10px 20px;
            border:none;
            border-radius:8px;
            text-decoration:none;
            cursor:pointer;
        }

        .btn:hover{
            background:#a30000;
        }

        .product-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
        }

        .product-card{
            background:white;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0px 4px 10px rgba(0,0,0,0.1);
            transition:0.3s;
        }

        .product-card:hover{
            transform:translateY(-5px);
        }

        .product-card img{
            width:100%;
            height:200px;
            object-fit:cover;
        }

        .product-info{
            padding:15px;
        }

        .product-info h3{
            margin:0;
            color:#8B0000;
        }

        .price{
            color:green;
            font-size:20px;
            margin:10px 0;
        }

        .delete-btn{
            background:red;
            color:white;
            padding:8px 15px;
            border-radius:8px;
            text-decoration:none;
        }

    </style>

</head>

<body>

    <div class="navbar">
        <h1>Kanha Sweets Admin</h1>

        <a href="/add-product" class="btn">
            Add Product
        </a>
    </div>

    <div class="container">

        <div class="card">
            <h2>Welcome Admin 👑</h2>
            <p>Manage sweets, prices, orders and products.</p>
        </div>

        <div class="product-grid">

            {% for product in products %}

            <div class="product-card">

                <img src="https://images.unsplash.com/photo-1601050690597-df0568f70950?q=80&w=1000&auto=format&fit=crop">

                <div class="product-info">

                    <h3>{{ product.name }}</h3>

                    <div class="price">
                        ₹{{ product.price }}
                    </div>

                    <a href="/delete-product/{{ product._id }}" class="delete-btn">
                        Delete
                    </a>

                </div>

            </div>

            {% endfor %}

        </div>

    </div>

</body>
</html>
